name: Build and Release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
env:
  python-version: "3.11"
  poetry-version: 1.5.0
jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      alive: ${{ steps.check.outputs.alive }}
    steps:
      # Fetches remote repository without --progress option.
      #
      # The default behavior of @actions/checkout outputs many noisy lines of
      # status output in the workflow log, which is problematic for log size.
      - name: Checkout latest repository commit
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Get new commits
        id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] ||
             [[ $(git log --oneline --since '24 hours ago' |
                  wc -l) -gt 0 ]]; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    runs-on: ${{ matrix.os }}
    needs: [check-commit]
    if: ${{ needs.check-commit.outputs.alive == 'true' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows 64bit"
            os: windows-latest
            arch: x64
            binary: ocebuild.exe
          - name: "Linux 64bit"
            os: ubuntu-latest
            arch: x64
            binary: ocebuild.linux
          - name: "macOS Intel"
            os: macos-15-intel
            arch: x64
            binary: ocebuild
          - name: "macOS Apple Silicon"
            os: macos-15
            arch: arm64
            binary: ocebuild.macos-arm64
    steps:
      # Fetches remote repository without --progress option.
      #
      # The default behavior of @actions/checkout outputs many noisy lines of
      # status output in the workflow log, which is problematic for log size.
      - name: Checkout latest repository commit
        uses: actions/checkout@v4
        with:
          show-progress: false

      # Setup python virtual environment
      - name: Install poetry
        run: pipx install poetry==${{ env.poetry-version }}
      - name: Setup Python ${{ env.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          architecture: ${{ matrix.arch }}
          cache: poetry
          cache-dependency-path: poetry.lock
      - name: Install python dev dependencies
        run: pip3 install packaging --ignore-installed

      - name: Set release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 ci/scripts/bump_version.py --version "$RELEASE_TAG"
          fi
          python3 - <<'PYTHON'
          import json
          import os
          from packaging.version import Version

          with open('ci/registry/project.json') as registry:
              version = json.load(registry)['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              prerelease = str(Version(version).is_prerelease).lower()
              print(f'prerelease={prerelease}', file=output)
          PYTHON

      # Setup Poetry virtual environment
      - name: Use matrix python version in Poetry virtualenv
        run: poetry env use $(python3 -c "import sys; print(sys.executable)")
      - name: Setup Poetry plugins and project dependencies
        run: poetry install -n
      # Build pyinstaller binary
      - name: Build pyinstaller binary
        run: poetry pyinstaller

      # Upload artifacts
      - name: Rename binary
        shell: bash
        run: |
          source=ocebuild
          if [[ "$OSTYPE" == "msys"* ]]; then source=ocebuild.exe; fi
          if [[ "$source" != "${{ matrix.binary }}" ]]; then
            mv "$source" "${{ matrix.binary }}"
          fi
        working-directory: dist
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: |
          lipo "dist/${{ matrix.binary }}" -verify_arch \
            "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
      - name: Verify packaged version
        shell: bash
        env:
          BINARY: dist/${{ matrix.binary }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          actual = subprocess.check_output(
              [os.path.abspath(os.environ['BINARY']), '--version'],
              text=True).strip()
          print(actual)
          expected = f"ocebuild-cli {os.environ['VERSION']}"
          if actual != expected:
              raise SystemExit(f'Expected {expected}, got {actual}')
          PYTHON
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocebuild-py${{ env.python-version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
  release:
    runs-on: ubuntu-latest
    needs: [check-commit, build]
    if: ${{ needs.check-commit.outputs.alive == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ocebuild-py${{ env.python-version }}-*
          path: dist
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R
        working-directory: dist
      - name: Set executable permissions
        run: |
          chmod +x dist/*

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: >-
            ${{ github.event_name == 'push' && github.ref_name || 'nightly' }}
          name: >-
            ${{ github.event_name == 'push' && github.ref_name ||
                format('Nightly Build (v{0})', needs.build.outputs.version) }}
          files: dist/ocebuild*
          prerelease: >-
            ${{ github.event_name != 'push' ||
                needs.build.outputs.prerelease == 'true' }}
          make_latest: >-
            ${{ github.event_name == 'push' &&
                needs.build.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          overwrite_files: true
